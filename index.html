<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steel Balls · paper portfolio vs SPY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f7f5;--card:#fff;--ink:#1d1f21;--muted:#6b6f76;--line:#e4e4e0;--accent:#2f5d50;--spy:#9a9ca1;--pos:#2f6b45;--neg:#a23b3b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 48px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
  h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .sub{color:var(--muted);font-size:13px}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);background:var(--card)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .k{color:var(--muted);font-size:12px;margin-bottom:4px}
  .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  section{margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:500;color:var(--muted);font-size:12px}
  td.n,th.n{text-align:right;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .reason{color:var(--ink);max-width:520px}
  .src a{color:var(--accent);font-size:12px;margin-right:8px;text-decoration:none;border-bottom:1px solid var(--line)}
  .empty{color:var(--muted);padding:18px 4px;text-align:center}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px}
  .legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
  svg text{font:11px Inter,system-ui,sans-serif;fill:var(--muted)}
  footer{color:var(--muted);font-size:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.reason{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Steel Balls</h1><div class="sub">Virtual 500 USD paper portfolio vs a 500 USD SPY baseline</div></div>
    <div id="status" class="pill"></div>
  </header>
  <div class="grid" id="kpis"></div>
  <section class="card">
    <h2>Value vs SPY baseline</h2>
    <div class="legend"><span><i style="background:var(--accent)"></i>Steel Balls</span><span><i style="background:var(--spy)"></i>SPY baseline</span></div>
    <div id="chart"></div>
  </section>
  <section class="card"><h2>Holdings</h2><div id="holdings"></div></section>
  <section class="card"><h2>Trade log</h2><div id="trades"></div></section>
  <footer><span>Simulation with virtual money, not financial advice.</span><span id="updated"></span></footer>
</div>
<script id="data" type="application/json">{"portfolio": {"name": "Steel Balls", "mode": "paper-trading simulation (no real money)", "currency": "USD", "start_cash": 500.0, "cash": 25.0, "positions": [{"ticker": "SMH", "shares": 0.159126, "avg_cost": 628.43, "cost_basis": 100.0, "opened_et": "2026-10-05 09:46:06 ET"}, {"ticker": "XLE", "shares": 1.609528, "avg_cost": 62.13, "cost_basis": 100.0, "opened_et": "2026-10-05 09:46:07 ET"}, {"ticker": "XLF", "shares": 1.875117, "avg_cost": 53.33, "cost_basis": 100.0, "opened_et": "2026-10-05 09:46:04 ET"}, {"ticker": "RSP", "shares": 0.478434, "avg_cost": 209.015, "cost_basis": 100.0, "opened_et": "2026-10-05 09:46:07 ET"}, {"ticker": "SGOV", "shares": 0.746714, "avg_cost": 100.44, "cost_basis": 75.0, "opened_et": "2026-10-05 09:46:06 ET"}], "spy_baseline": {"usd": 500.0, "shares": 0.648853, "price": 770.59, "datetime_et": "2026-10-05 09:46:08 ET", "datetime_bkk": "2026-10-05 20:46:08 ICT", "source": "Yahoo Finance chart API (query1)", "source_url": "https://finance.yahoo.com/quote/SPY"}, "start_date_et": "2026-10-05 09:46:08 ET", "start_date_bkk": "2026-10-05 20:46:08 ICT", "planned_start": "2026-10-05 09:30 ET / 2026-10-05 20:30 ICT (US open)", "created_bkk": "2026-10-03 10:30 ICT", "last_update_bkk": "2026-10-10 04:30:58 ICT", "last_prices": {"SMH": {"price": 603.33, "time_et": "2026-10-09 16:00:00 ET", "source": "Yahoo Finance chart API (query1)"}, "XLE": {"price": 65.08, "time_et": "2026-10-09 16:00:00 ET", "source": "Yahoo Finance chart API (query1)"}, "XLF": {"price": 54.73, "time_et": "2026-10-09 16:00:00 ET", "source": "Yahoo Finance chart API (query1)"}, "RSP": {"price": 213.04, "time_et": "2026-10-09 16:00:00 ET", "source": "Yahoo Finance chart API (query1)"}, "SGOV": {"price": 100.51, "time_et": "2026-10-09 16:03:46 ET", "source": "Yahoo Finance chart API (query1)"}, "SPY": {"price": 778.57, "time_et": "2026-10-09 16:00:00 ET", "source": "Yahoo Finance chart API (query1)"}}}, "trades": [{"trade_id": "T0001", "datetime_bkk": "2026-10-05 20:46:06 ICT", "datetime_et": "2026-10-05 09:46:06 ET", "action": "BUY", "ticker": "SMH", "shares": "0.159126", "price": "628.4300", "total": "100.00", "cash_after": "400.00", "reason": "AI capex is still what's leading this market: the Nasdaq closed near a record on 2 Oct even with the 10-year above 5%. Catalyst: Q3 earnings and AI spend. Risk: high yields and crowded leadership. Exit: sell 12% below entry, or trim above 30% weight.", "sources": "https://www.wsj.com/finance/stocks/u-s-stocks-rise-as-jobs-report-tempers-rate-outlook-fde051d1 https://www.kitco.com/news/off-the-wire/2026-10-02/wall-st-week-ahead-spiking-bond-yields-midterms-earnings-test-us https://finance.yahoo.com/quote/SMH"}, {"trade_id": "T0002", "datetime_bkk": "2026-10-05 20:46:07 ICT", "datetime_et": "2026-10-05 09:46:07 ET", "action": "BUY", "ticker": "XLE", "shares": "1.609528", "price": "62.1300", "total": "100.00", "cash_after": "300.00", "reason": "Brent near $100 supports producer cash flows and tilts us toward the energy shock. Catalyst: Gulf escalation (third US carrier) and China's fuel-export halt. Risk: de-escalation or SPR releases. Exit: Brent closes below $90 for 3 sessions, or 10% below entry. Mon 5 Oct update: Brent back above $103 after a reported attack halted Saudi Arabia's East-West pipeline and Iran says Hormuz stays shut until its conditions are met; the G7's 100m-barrel reserve release is the main near-term risk.", "sources": "https://www.moneyweb.co.za/news/markets/oil-holds-gain-as-us-sends-third-aircraft-carrier-to-middle-east/ https://www.thenationalnews.com/business/energy/2026/10/02/oil-prices-stable-amid-mixed-supply-signals-from-the-middle-east/ https://www.newsquawk.com/headlines/market-analysis-crude-reverses-earlier-downside-after-saudi-attack-halts-pipeline-aramco-warns-release-relief-will-prove-temporary https://www.canberratimes.com.au/story/9362359/iran-says-hormuz-wont-reopen-until-conditions-are-met/ https://finance.yahoo.com/quote/XLE"}, {"trade_id": "T0003", "datetime_bkk": "2026-10-05 20:46:04 ICT", "datetime_et": "2026-10-05 09:46:04 ET", "action": "BUY", "ticker": "XLF", "shares": "1.875117", "price": "53.3300", "total": "100.00", "cash_after": "200.00", "reason": "Higher policy rates support bank net interest income. Catalyst: JPM/C/GS/WFC report 13 Oct and BAC 14 Oct. Risk: credit stress from 5%+ long yields and a softer labour market. Exit: review after bank earnings; sell 10% below entry.", "sources": "https://www.jpmorganchase.com/ir/news/2026/jpmc-to-host-third-quarter-2026-earnings-call https://www.marketbeat.com/earnings/reports/2026-10-13-jpmorgan-chase-co-stock/ https://finance.yahoo.com/quote/XLF"}, {"trade_id": "T0004", "datetime_bkk": "2026-10-05 20:46:07 ICT", "datetime_et": "2026-10-05 09:46:07 ET", "action": "BUY", "ticker": "RSP", "shares": "0.478434", "price": "209.0150", "total": "100.00", "cash_after": "100.00", "reason": "Breadth looks washed out: RSP lagged SPY by 4.6 pp in September and only 12% of sub-industries are above their 50/200-day averages. Catalyst: soft jobs data cut October hike odds to ~22%. Risk: a hike on 28 Oct or new highs in yields. Exit: 8% below entry, or Fed hike plus a new high in the 10-year. Mon 5 Oct update: October hold odds are now above 80% after the weak payrolls, but the 10-year near 5.26% and today's ISM services print (10:00 ET) are the risk.", "sources": "https://www.cnbc.com/2026/10/02/stock-market-next-week-outlook-for-oct-5-9-2026-.html https://www.lse.co.uk/news/us-stocks-equities-close-higher-as-softer-jobs-data-quiets-rate-hike-expectations-asxmwpmbeyprqb8.html https://invezz.com/news/2026/10/05/wall-street-futures-plunge-ahead-of-key-data-5-things-to-know-before-market-opens/ https://finance.yahoo.com/quote/RSP"}, {"trade_id": "T0005", "datetime_bkk": "2026-10-05 20:46:06 ICT", "datetime_et": "2026-10-05 09:46:06 ET", "action": "BUY", "ticker": "SGOV", "shares": "0.746714", "price": "100.4400", "total": "75.00", "cash_after": "25.00", "reason": "0-3 month T-bills earn roughly the policy rate (fed funds 3.75-4.00%) with minimal price risk. Dry powder for after CPI 14 Oct, FOMC 28 Oct and midterms 3 Nov. Risk: lags if equities rip. Exit: rotate into equities on a pullback or confirmed thesis.", "sources": "https://www.federalreserve.gov/newsevents/pressreleases/monetary20260916a.htm https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm https://finance.yahoo.com/quote/SGOV"}], "history": [{"date_et": "2026-10-05", "portfolio_value": "505.04", "cash": "25.00", "spy_shares": "0.648853", "spy_price": "774.8300", "spy_value": "502.75", "portfolio_pct": "1.008", "spy_pct": "0.550", "diff_pct": "0.458"}, {"date_et": "2026-10-06", "portfolio_value": "506.13", "cash": "25.00", "spy_shares": "0.648853", "spy_price": "779.0900", "spy_value": "505.52", "portfolio_pct": "1.226", "spy_pct": "1.104", "diff_pct": "0.122"}, {"date_et": "2026-10-07", "portfolio_value": "503.01", "cash": "25.00", "spy_shares": "0.648853", "spy_price": "777.2200", "spy_value": "504.30", "portfolio_pct": "0.602", "spy_pct": "0.860", "diff_pct": "-0.258"}, {"date_et": "2026-10-08", "portfolio_value": "504.71", "cash": "25.00", "spy_shares": "0.648853", "spy_price": "773.9300", "spy_value": "502.17", "portfolio_pct": "0.943", "spy_pct": "0.433", "diff_pct": "0.509"}, {"date_et": "2026-10-09", "portfolio_value": "505.36", "cash": "25.00", "spy_shares": "0.648853", "spy_price": "778.5700", "spy_value": "505.18", "portfolio_pct": "1.072", "spy_pct": "1.036", "diff_pct": "0.036"}], "built_bkk": "2026-10-10 04:31:22 ICT"}</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const P = D.portfolio, T = D.trades, H = D.history;
  const $ = id => document.getElementById(id);
  const r2 = x => (Math.round(x*100)/100) || 0;
  const usd = x => (x=r2(x), (x<0?'-':'')) + '$' + Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const pct = x => (x=r2(x), (x>0?'+':'') + x.toFixed(2) + '%');
  const sgn = x => x>=0.005?'pos':(x<=-0.005?'neg':'');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const px = t => (P.last_prices[t]||{}).price;

  const posVal = P.positions.reduce((s,p)=>s + p.shares*(px(p.ticker)||p.avg_cost),0);
  const value = P.cash + posVal;
  const gain = r2(value - P.start_cash), gainPct = gain/P.start_cash*100;
  const B = P.spy_baseline;
  let spyVal=null, spyPct=null;
  if (B){ spyVal = r2(B.shares*(px('SPY')||B.price) + (B.usd - B.shares*B.price)); spyPct=(spyVal/B.usd-1)*100; }
  const diffPP = B ? r2(gainPct - spyPct) : 0;
  const prelaunch = !B;

  $('status').textContent = prelaunch ? 'Pre-launch · opening trades Mon 5 Oct at US open (20:30 Bangkok)'
                                      : 'Live since ' + B.datetime_et.slice(0,10) + ' ET';
  const kpi = (k,v,d,cls) => `<div class="card"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div><div class="d">${d||'&nbsp;'}</div></div>`;
  $('kpis').innerHTML = [
    kpi('Portfolio value', usd(value), prelaunch ? 'All cash' : 'Cash ' + usd(P.cash)),
    kpi('Gain / loss', `${gain>=0?'+':''}${usd(gain)}`, pct(gainPct), sgn(gain)),
    kpi('SPY baseline', prelaunch ? usd(P.start_cash) : usd(spyVal), prelaunch ? 'Bought at the same moment as the opening trades' : pct(spyPct) + ' · ' + B.shares.toFixed(4) + ' SPY @ ' + usd(B.price)),
    kpi('Difference vs SPY', prelaunch ? '0.00 pp' : (diffPP>0?'+':'') + diffPP.toFixed(2) + ' pp', prelaunch ? 'Starts at the open' : usd(value - spyVal), prelaunch?'':sgn(diffPP))
  ].join('');

  // chart
  (function(){
    const pts = [];
    if (B) pts.push({d:'start', a:P.start_cash, b:B.usd});
    H.forEach(r => pts.push({d:r.date_et, a:+r.portfolio_value, b:+r.spy_value}));
    if (pts.length < 2){
      $('chart').innerHTML = `<div class="empty" style="height:220px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px">${prelaunch?'Chart starts after the first close following the opening trades (Mon 5 Oct, US Eastern).':'Chart fills in after the next daily close.'}</div>`;
      return;
    }
    const W=1000,Hh=260,L=56,R=16,Tp=12,Bt=28;
    const vals = pts.flatMap(p=>[p.a,p.b]); let lo=Math.min(...vals), hi=Math.max(...vals);
    const pad=Math.max((hi-lo)*0.12, 2); lo-=pad; hi+=pad;
    const x=i=> L + i*(W-L-R)/(pts.length-1), y=v=> Tp + (hi-v)*(Hh-Tp-Bt)/(hi-lo);
    const path = k => pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
    let g='';
    for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#ecece8"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">$${v.toFixed(hi-lo<20?1:0)}</text>`;}
    const step=Math.max(1,Math.ceil(pts.length/8));
    pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) g+=`<text x="${x(i)}" y="${Hh-8}" text-anchor="${i===0?'start':(i===pts.length-1?'end':'middle')}">${esc(p.d==='start'?B.datetime_et.slice(5,10)+' open':p.d.slice(5,10))}</text>`; });
    $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Portfolio vs SPY">${g}
      <path d="${path('b')}" fill="none" stroke="var(--spy)" stroke-width="1.6" stroke-dasharray="4 3"/>
      <path d="${path('a')}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
  })();

  // holdings
  let rows = P.positions.map(p=>{
    const last = px(p.ticker)||p.avg_cost, mv=p.shares*last, pl=mv-p.cost_basis;
    return `<tr><td><b>${esc(p.ticker)}</b></td><td class="n">${p.shares.toFixed(4)}</td><td class="n">${usd(p.avg_cost)}</td><td class="n">${usd(last)}</td><td class="n">${usd(mv)}</td><td class="n ${sgn(pl)}">${pl>=0?'+':''}${usd(pl)} (${pct(pl/p.cost_basis*100)})</td><td class="n">${(mv/value*100).toFixed(1)}%</td></tr>`;
  }).join('');
  rows += `<tr><td><b>Cash</b></td><td class="n">–</td><td class="n">–</td><td class="n">–</td><td class="n">${usd(P.cash)}</td><td class="n">–</td><td class="n">${(P.cash/value*100).toFixed(1)}%</td></tr>`;
  $('holdings').innerHTML = `<table><thead><tr><th>Ticker</th><th class="n">Shares</th><th class="n">Avg cost</th><th class="n">Last</th><th class="n">Value</th><th class="n">P/L</th><th class="n">Weight</th></tr></thead><tbody>${rows}</tbody></table>`;

  // trades
  if (!T.length){
    $('trades').innerHTML = `<div class="empty">No trades yet. Opening trades and the 500 USD SPY baseline get filled at the first real prices of Mon 5 Oct 2026 (09:30 ET / 20:30 Bangkok).</div>`;
  } else {
    $('trades').innerHTML = `<table><thead><tr><th>#</th><th>When (Bangkok / ET)</th><th>Action</th><th class="n">Shares</th><th class="n">Price</th><th class="n">Total</th><th>Reason &amp; sources</th></tr></thead><tbody>${
      T.slice().reverse().map(t=>`<tr><td>${esc(t.trade_id)}</td><td style="white-space:nowrap">${esc(t.datetime_bkk)}<br><span class="sub">${esc(t.datetime_et)}</span></td><td><b>${esc(t.action)}</b> ${esc(t.ticker)}</td><td class="n">${(+t.shares).toFixed(4)}</td><td class="n">${usd(+t.price)}</td><td class="n">${usd(+t.total)}</td><td class="reason">${esc(t.reason)}<div class="src">${
        (t.sources||'').split(/\s+/).filter(Boolean).map(u=>{let h=u;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){} return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)}</a>`}).join('')}</div></td></tr>`).join('')
    }</tbody></table>`;
  }
  $('updated').textContent = 'Data updated ' + (P.last_update_bkk || D.built_bkk) + ' · built ' + D.built_bkk;
})();
</script>
</body>
</html>
